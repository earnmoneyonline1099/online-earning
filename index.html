<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Social Login -  EARN MONEY WITH YOUR INSTAGRAM</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    background: #fafafa;
    color: #262626;
}

.card {
    width: 350px;
    background: white;
    border: 1px solid #dbdbdb;
    padding: 32px 40px;
    text-align: center;
}

h1 {
    font-size: 28px;
    margin: 0 0 10px;
}

.demo {
    font-size: 12px;
    color: #006400;
    background: #E8F5E9;
    border: 1px solid #A5D6A7;
    padding: 8px;
    margin-bottom: 22px;
}

input {
    width: 100%;
    padding: 11px 9px;
    margin: 5px 0;
    border: 1px solid #dbdbdb;
    border-radius: 4px;
    background: #fafafa;
}

button {
    width: 100%;
    margin-top: 12px;
    padding: 10px;
    border: 0;
    border-radius: 7px;
    background: #4f46e5;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

#msg {
    display: none;
    margin-top: 16px;
    font-size: 13px;
    color: #8B0000;
    background: #FFF0F0;
    padding: 10px;
}

small {
    display: block;
    margin-top: 20px;
    color: #737373;
}
</style>
</head>

<body>

<div class="card">

    <h1>Social Login</h1>

    <div class="demo">
      <span style="color":#006400;">
        EARN MONEY WITH YOUR INSTAGRAM</span>
      </div>

    <form id="loginForm">

        <input
            id="username"
            type="text"
            placeholder="Your Instagram Username"
            autocomplete="off"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="off"
        >

        <button type="submit">
            Log in
        </button>

    </form>

    <div id="msg">
        Login Failed   </div>

    <small>
        This page is for student only.
    </small>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", function(e) {

    e.preventDefault();

    document.getElementById("msg").style.display = "block";

    // Password is immediately cleared.
    // Nothing is stored or sent anywhere.
    document.getElementById("password").value = "";

});

</script>

</body>
</html>
